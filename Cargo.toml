[package]
name = "post_cards"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0" # NixOS 26.05
license = "GPL-3.0"
authors = ["Alexander A. Klimov <a@kli.mov>"]

[dependencies]
humantime = "2.3.0"
percent-encoding-rfc3986 = "0.1.3"
serde_json = "1"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.ureq]
version = "3.2.0"
default-features = false
features = ["native-tls", "json"]
